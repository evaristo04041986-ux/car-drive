

<!DOCTYPE html>

<html lang="it">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<meta name="apple-mobile-web-app-capable" content="yes">

<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

<meta name="theme-color" content="#080d16">

<title>CAR DRIVE</title>

<style>

* { box-sizing: border-box; }

body {

  margin: 0;

  min-height: 100vh;

  background: radial-gradient(circle at top, #172b46, #080d16 65%);

  color: white;

  font-family: -apple-system, BlinkMacSystemFont, Arial, sans-serif;

  display: flex;

  justify-content: center;

  align-items: center;

  padding: 22px;

}

.container {

  width: 100%;

  max-width: 650px;

  text-align: center;

}

.header {

  color: #58aaff;

  font-size: 15px;

  letter-spacing: 7px;

  font-weight: 700;

  margin-bottom: 12px;

}

.clock {

  font-size: clamp(48px, 14vw, 76px);

  font-weight: 300;

  letter-spacing: 2px;

}

.date {

  color: #aabbd0;

  font-size: 16px;

  margin: 4px 0 30px;

  text-transform: capitalize;

}

.grid {

  display: grid;

  grid-template-columns: repeat(2, 1fr);

  gap: 15px;

}

.tile {

  min-height: 125px;

  border: 1px solid #29466a;

  border-radius: 22px;

  background: linear-gradient(145deg, #192b42, #0d1727);

  color: white;

  text-decoration: none;

  display: flex;

  flex-direction: column;

  align-items: center;

  justify-content: center;

  gap: 10px;

  box-shadow: 0 8px 25px #0005;

  -webkit-tap-highlight-color: transparent;

}

.tile:active {

  background: #244b75;

  transform: scale(.97);

}

.symbol {

  font-size: 35px;

}

.tile span:last-child {

  font-size: 16px;

  font-weight: 700;

  letter-spacing: 1px;

}

.siri {

  margin-top: 20px;

  width: 100%;

  min-height: 58px;

  border: 1px solid #438bd1;

  border-radius: 18px;

  background: #102b49;

  color: white;

  font-size: 17px;

  font-weight: 700;

}

.footer {

  color: #71849c;

  font-size: 11px;

  letter-spacing: 4px;

  margin-top: 25px;

}

@media (orientation: landscape) {

  body { padding: 10px 35px; }

  .container { max-width: 850px; }

  .date { margin-bottom: 15px; }

  .grid { gap: 12px; }

  .tile { min-height: 105px; }

  .siri { margin-top: 12px; min-height: 48px; }

  .footer { margin-top: 12px; }

}

</style>

</head>

<body>

<div class="container">

  <div class="header">WELCOME TO</div>

  <div class="header" style="font-size:25px; letter-spacing:6px; color:white;">

    CAR DRIVE

  </div>

  <div class="clock" id="clock">--:--</div>

  <div class="date" id="date"></div>

  <div class="grid">

    <a class="tile" href="shortcuts://run-shortcut?name=TOMTOM">

      <span class="symbol">🧭</span>

      <span>NAVIGATION</span>

    </a>

    <a class="tile" href="shortcuts://run-shortcut?name=MUSIC">

      <span class="symbol">♫</span>

      <span>APPLE MUSIC</span>

    </a>

    <a class="tile" href="shortcuts://run-shortcut?name=TELEFONO">

      <span class="symbol">☎</span>

      <span>TELEFONO</span>

    </a>

    <a class="tile" href="shortcuts://run-shortcut?name=WHATSAPP">

      <span class="symbol">◉</span>

      <span>WHATSAPP</span>

    </a>

  </div>

  <button class="siri" onclick="alert('Di: Ehi Siri, oppure tieni premuto il tasto laterale dell’iPhone.')">

    ✨ SIRI

  </button>

  <div class="footer">DRIVE • MUSIC • CONNECT</div>

</div>

<script>

function updateClock() {

  const now = new Date();

  document.getElementById("clock").textContent =

    now.toLocaleTimeString("it-IT", {hour:"2-digit", minute:"2-digit"});

  document.getElementById("date").textContent =

    now.toLocaleDateString("it-IT", {

      weekday:"long", day:"numeric", month:"long"

    });

}

updateClock();

setInterval(updateClock, 1000);

</script>

</body>

</html>
