

<!DOCTYPE html>

<html lang="it">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<meta name="apple-mobile-web-app-capable" content="yes">

<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

<meta name="theme-color" content="#070C14">

<title>CAR DRIVE</title>

<style>

* { box-sizing:border-box; }

body {

 margin:0;

 min-height:100vh;

 min-height:100dvh;

 background:radial-gradient(ellipse at 50% 0%,#193451 0%,#0a1422 48%,#05080e 100%);

 color:#fff;

 font-family:-apple-system,BlinkMacSystemFont,Arial,sans-serif;

 display:flex;

 align-items:center;

 justify-content:center;

 padding:20px;

}

.dashboard {

 width:100%;

 max-width:1000px;

}

.top {

 display:flex;

 align-items:center;

 justify-content:space-between;

 border-bottom:1px solid #29435d;

 padding-bottom:15px;

}

.brand {

 display:flex;

 align-items:center;

 gap:13px;

}

.roundel {

 width:48px;

 height:48px;

 border-radius:50%;

 border:2px solid #7bbcff;

 display:flex;

 align-items:center;

 justify-content:center;

 font-size:12px;

 font-weight:900;

 color:#fff;

 background:linear-gradient(135deg,#183c62,#071321);

 box-shadow:0 0 18px #278cff55;

}

.brandname {

 font-size:22px;

 font-weight:800;

 letter-spacing:4px;

}

.subtitle {

 color:#80a5c9;

 font-size:9px;

 letter-spacing:3px;

 margin-top:4px;

}

.status {

 color:#72dca3;

 font-size:11px;

 letter-spacing:2px;

}

.timearea {

 display:flex;

 align-items:center;

 justify-content:space-between;

 padding:18px 5px 24px;

}

.clock {

 font-size:clamp(55px,12vw,88px);

 font-weight:200;

 letter-spacing:2px;

 line-height:1;

 font-variant-numeric:tabular-nums;

}

.date {

 color:#9eb4ca;

 font-size:14px;

 text-transform:capitalize;

 text-align:right;

}

.section {

 color:#6d91b5;

 font-size:10px;

 letter-spacing:4px;

 margin:0 0 13px 5px;

}

.apps {

 display:grid;

 grid-template-columns:repeat(4,1fr);

 gap:14px;

}

.app {

 min-height:145px;

 border:1px solid #294b6d;

 border-radius:18px;

 background:linear-gradient(145deg,#1a3048,#0b1727);

 color:white;

 text-decoration:none;

 display:flex;

 flex-direction:column;

 align-items:center;

 justify-content:center;

 gap:13px;

 box-shadow:0 8px 24px #0006,inset 0 1px #ffffff12;

 transition:.15s;

 -webkit-tap-highlight-color:transparent;

}

.app:active {

 transform:scale(.96);

 background:#20466c;

}

.symbol {

 font-size:39px;

 color:#78baff;

 line-height:1;

}

.appname {

 font-size:12px;

 font-weight:800;

 letter-spacing:2px;

}

.siri {

 margin-top:18px;

 width:100%;

 min-height:55px;

 border:1px solid #387fba;

 border-radius:16px;

 color:white;

 background:linear-gradient(90deg,#122b46,#1b4268,#122b46);

 font-size:15px;

 font-weight:700;

 letter-spacing:3px;

}

.bottom {

 text-align:center;

 color:#58728d;

 font-size:9px;

 letter-spacing:4px;

 margin-top:18px;

}

@media (max-width:600px) {

 body { padding:16px; }

 .apps { gap:8px; }

 .app { min-height:115px; border-radius:13px; gap:10px; }

 .symbol { font-size:31px; }

 .appname { font-size:9px; letter-spacing:1px; }

 .brandname { font-size:18px; }

 .roundel { width:40px;height:40px; }

}

@media (orientation:landscape) {

 body { padding:10px 30px; }

 .dashboard { max-width:1100px; }

 .top { padding-bottom:9px; }

 .roundel { width:40px;height:40px; }

 .timearea { padding:9px 5px 13px; }

 .clock { font-size:62px; }

 .app { min-height:105px; }

 .symbol { font-size:32px; }

 .siri { min-height:43px; margin-top:12px; }

 .bottom { margin-top:10px; }

}

</style>

</head>

<body>

<main class="dashboard">

 <header class="top">

  <div class="brand">

   <div class="roundel">BMW</div>

   <div>

    <div class="brandname">CAR DRIVE</div>

    <div class="subtitle">CONNECTED EXPERIENCE</div>

   </div>

  </div>

  <div class="status">● READY</div>

 </header>

 <section class="timearea">

  <div class="clock" id="clock">--:--</div>

  <div class="date" id="date"></div>

 </section>

 <div class="section">YOUR DRIVE</div>

 <section class="apps">

  <a class="app" href="shortcuts://run-shortcut?name=TOMTOM">

   <span class="symbol">⌖</span>

   <span class="appname">NAVIGATION</span>

  </a>

  <a class="app" href="shortcuts://run-shortcut?name=MUSIC">

   <span class="symbol">♫</span>

   <span class="appname">APPLE MUSIC</span>

  </a>

  <a class="app" href="shortcuts://run-shortcut?name=TELEFONO">

   <span class="symbol">☎</span>

   <span class="appname">PHONE</span>

  </a>

  <a class="app" href="shortcuts://run-shortcut?name=WHATSAPP">

   <span class="symbol">◉</span>

   <span class="appname">WHATSAPP</span>

  </a>

 </section>

 <button class="siri" onclick="alert('Di: Ehi Siri, oppure tieni premuto il tasto laterale dell’iPhone.')">

  ✦ &nbsp; SIRI

 </button>

 <footer class="bottom">

  BMW INSPIRED · DIGITAL COCKPIT

 </footer>

</main>

<script>

function updateClock() {

 const now = new Date();

 document.getElementById("clock").textContent =

 now.toLocaleTimeString("it-IT",{hour:"2-digit",minute:"2-digit"});

 document.getElementById("date").textContent =

 now.toLocaleDateString("it-IT",{

 weekday:"long",day:"numeric",month:"long"

 });

}

updateClock();

setInterval(updateClock,1000);

</script>

</body>

</html>
